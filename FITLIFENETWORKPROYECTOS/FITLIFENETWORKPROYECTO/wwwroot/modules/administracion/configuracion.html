<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Configuración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

</head>
<body class="bg-light" data-page="configuracion.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../administracion.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-sliders me-2"></i>Administración</a>
                    <a href="usuarios.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-person-gear me-2"></i>Usuarios</a>
                    <a href="auditoria.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-journal-text me-2"></i>Auditoría</a>

                    <a href="configuracion.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-gear me-2"></i>Configuración</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Configuración</p>
                        <h1 class="h2 fw-bold mb-0">Sedes, turnos y parámetros</h1>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Configuración</th>
                                        <th>Valor</th>
                                        <th>Ubicación</th>
                                        <th>Estado</th>
                                    </tr>
                                </thead>
                                <tbody id="configTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

        </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/administracion.js"></script>
