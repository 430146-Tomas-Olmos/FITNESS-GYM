<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light" data-page="usuarios.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../administracion.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-sliders me-2"></i>Administración</a>
                    <a href="usuarios.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-person-gear me-2"></i>Usuarios</a>
                    <a href="auditoria.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-journal-text me-2"></i>Auditoría</a>
                    <a href="reportes.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-bar-chart me-2"></i>Reportes</a>
                    <a href="configuracion.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-gear me-2"></i>Configuración</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Usuarios y roles</p>
                        <h1 class="h2 fw-bold mb-0">Listado de usuarios</h1>
                    </div>
                    <button id="newUserBtn" class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                        <i class="bi bi-plus-circle me-2"></i>Nuevo usuario
                    </button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Buscar</label>
                                <input id="searchUsuario" type="text" class="form-control" placeholder="Nombre, usuario o email" />
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Rol</label>
                                <select id="filterRol" class="form-select">
                                    <option value="Todos">Todos</option>
                                    <option value="Gerente General">Gerente General</option>
                                    <option value="Gerente Miembros">Gerente Miembros</option>
                                    <option value="Gerente Ventas">Gerente Ventas</option>
                                    <option value="Técnico">Técnico</option>
                                    <option value="Vendedor">Vendedor</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Estado</label>
                                <select id="filterEstado" class="form-select">
                                    <option value="Todos">Todos</option>
                                    <option value="Activo">Activo</option>
                                    <option value="Inactivo">Inactivo</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Usuario</th>
                                        <th>Rol</th>
                                        <th>Sede</th>
                                        <th>Último acceso</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="usuariosTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Alta / edición de usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="usuarioForm" class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input id="usuarioNombre" type="text" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Usuario</label>
                            <input id="usuarioAlias" type="text" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input id="usuarioEmail" type="email" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Rol</label>
                            <select id="usuarioRol" class="form-select" required>
                                <option value="Gerente General">Gerente General</option>
                                <option value="Gerente Miembros">Gerente Miembros</option>
                                <option value="Gerente Ventas">Gerente Ventas</option>
                                <option value="Técnico">Técnico</option>
                                <option value="Vendedor">Vendedor</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Sede</label>
                            <select id="usuarioSede" class="form-select">
                                <option value="Casa Central">Casa Central</option>
                                <option value="Belgrano">Belgrano</option>
                                <option value="San Isidro">San Isidro</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado</label>
                            <select id="usuarioEstado" class="form-select">
                                <option value="Activo">Activo</option>
                                <option value="Inactivo">Inactivo</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="usuarioForm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/administracion.js"></script>
    <script src="../../assets/js/roleGuard.js"></script>
</body>
</html>
