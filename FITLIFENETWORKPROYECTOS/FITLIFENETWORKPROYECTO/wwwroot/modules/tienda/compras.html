<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Compras</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light" data-page="compras.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../tienda.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-bag me-2"></i>Tienda</a>
                    <a href="productos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-box-seam me-2"></i>Productos</a>
                    <a href="ventas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-cash-coin me-2"></i>Ventas</a>
                    <a href="compras.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-truck me-2"></i>Compras</a>
                    <a href="stock.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-clipboard-data me-2"></i>Stock</a>
                    <a href="cajas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-wallet2 me-2"></i>Cajas</a>
                    <a href="transferencias.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-arrow-left-right me-2"></i>Transferencias</a>
                    <a href="devoluciones.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-arrow-counterclockwise me-2"></i>Devoluciones</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Compras</p>
                        <h1 class="h2 fw-bold mb-0">Ingresos de stock</h1>
                    </div>
                </div>

                <form id="compraForm" class="row g-3 mb-4">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Proveedor</label>
                        <select id="compraIdProveedor" class="form-select" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Sede</label>
                        <select id="compraIdSede" class="form-select" required></select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Fecha</label>
                        <input type="date" class="form-control" value="" />
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Producto</label>
                        <select id="compraIdProducto" class="form-select"></select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label fw-semibold">Cantidad</label>
                        <input id="compraCantidad" type="number" min="1" value="1" class="form-control" />
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Costo unitario</label>
                        <input id="compraPrecioCosto" type="number" min="0" step="0.01" class="form-control" />
                    </div>
                    <div class="col-md-3 d-flex align-items-end">
                        <button id="btnAddCompraItem" type="button" class="btn btn-outline-primary w-100">Agregar</button>
                    </div>
                    <div class="col-12 d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Guardar compra</button>
                    </div>
                </form>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Cantidad</th>
                                        <th>Costo unitario</th>
                                        <th>Subtotal</th>
                                        <th>Acción</th>
                                    </tr>
                                </thead>
                                <tbody id="compraItemsBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mt-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Proveedor</th>
                                        <th>Sede</th>
                                        <th>Fecha</th>
                                        <th>Total</th>
                                    </tr>
                                </thead>
                                <tbody id="comprasTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/tienda.js"></script>
    <script src="../../assets/js/roleGuard.js"></script>
</body>
</html>
