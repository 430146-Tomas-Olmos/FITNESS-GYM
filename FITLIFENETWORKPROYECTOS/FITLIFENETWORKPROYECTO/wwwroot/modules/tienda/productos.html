<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light" data-page="productos.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../tienda.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-bag me-2"></i>Tienda</a>
                    <a href="productos.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-box-seam me-2"></i>Productos</a>
                    <a href="ventas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-cash-coin me-2"></i>Ventas</a>
                    <a href="compras.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-truck me-2"></i>Compras</a>
                    <a href="stock.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-clipboard-data me-2"></i>Stock</a>
                    <a href="cajas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-wallet2 me-2"></i>Cajas</a>
                    <a href="transferencias.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-arrow-left-right me-2"></i>Transferencias</a>
                    <a href="devoluciones.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-arrow-counterclockwise me-2"></i>Devoluciones</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Productos</p>
                        <h1 class="h2 fw-bold mb-0">Catálogo y stock</h1>
                    </div>
                    <button id="newProductoBtn" class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#modalProducto">
                        <i class="bi bi-plus-circle me-2"></i>Nuevo producto
                    </button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-10">
                                <label class="form-label fw-semibold">Buscar</label>
                                <input id="searchProducto" type="text" class="form-control" placeholder="Nombre, código o categoría" />
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Producto</th>
                                        <th>Categoría</th>
                                        <th>Código</th>
                                        <th>Precio</th>
                                        <th>Stock mínimo</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="productosTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalProducto" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Alta / edición de producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productoForm" class="row g-3">
                        <input type="hidden" id="productoId" />
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Categoría</label>
                            <select id="productoIdCategoria" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input id="productoNombre" type="text" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Código de barras</label>
                            <input id="productoCodigo" type="text" class="form-control" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Precio</label>
                            <input id="productoPrecio" type="number" min="0" step="0.01" class="form-control" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Stock mínimo</label>
                            <input id="productoStockMinimo" type="number" min="0" class="form-control" required />
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="productoForm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/tienda.js"></script>
</body>
</html>
