<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light" data-page="equipos.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../equipamiento.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-tools me-2"></i>Equipamiento</a>
                    <a href="equipos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-bicycle me-2"></i>Equipos</a>
                    <a href="incidencias.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-exclamation-triangle me-2"></i>Incidencias</a>
                    <a href="mantenimientos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-tools me-2"></i>Mantenimientos</a>
                    <a href="proveedores.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-truck me-2"></i>Proveedores</a>
                </nav>
            </aside>

            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Equipos</p>
                        <h1 class="h2 fw-bold mb-0">Inventario de máquinas</h1>
                    </div>
                    <button id="newEquipoBtn" class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#modalEquipo">
                        <i class="bi bi-plus-circle me-2"></i>Nuevo equipo
                    </button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Filtrar por sede</label>
                                <select id="equipoSedeFilter" class="form-select"></select>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Equipo</th>
                                        <th>Sede</th>
                                        <th>Número de serie</th>
                                        <th>Fecha adq.</th>
                                        <th>Estado</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="equiposTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalEquipo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Alta / edición de equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="equipoForm" class="row g-3">
                        <input type="hidden" id="equipoId" />
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Sede</label>
                            <select id="equipoIdSede" class="form-select" required></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input id="equipoNombre" type="text" class="form-control" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Número de serie</label>
                            <input id="equipoNumeroSerie" type="text" class="form-control" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Fecha adquisición</label>
                            <input id="equipoFechaAdquisicion" type="date" class="form-control" required />
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Estado operativo</label>
                            <select id="equipoEstadoOperativo" class="form-select">
                                <option value="ACTIVO">ACTIVO</option>
                                <option value="EN MANTENIMIENTO">EN MANTENIMIENTO</option>
                                <option value="FUERA DE SERVICIO">FUERA DE SERVICIO</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="equipoForm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/equipamiento.js"></script>
    <script src="../../assets/js/roleGuard.js"></script>
</body>
</html>
