<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Socios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light" data-page="socios.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../miembros.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-people me-2"></i>Miembros</a>
                    <a href="socios.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-person-badge me-2"></i>Socios</a>
                    <a href="contratos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-file-earmark-text me-2"></i>Contratos</a>
                    <a href="cuotas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-cash-stack me-2"></i>Cuotas</a>
                    <a href="accesos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-door-open me-2"></i>Accesos</a>
                    <a href="reservas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-calendar3 me-2"></i>Reservas</a>
                    <a href="convenios.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-building me-2"></i>Convenios</a>
                    <a href="aptos-medicos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-card-checklist me-2"></i>Aptos</a>
                    <a href="historial.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-clock-history me-2"></i>Historial</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Socios</p>
                        <h1 class="h2 fw-bold mb-0">Listado de socios</h1>
                    </div>
                    <button id="newSocioBtn" class="btn btn-primary fw-semibold" data-bs-toggle="modal" data-bs-target="#modalSocio">
                        <i class="bi bi-plus-circle me-2"></i>Alta de socio
                    </button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body">
                        <div class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Buscar</label>
                                <input id="searchSocio" type="text" class="form-control" placeholder="Nombre, DNI o email" />
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Estado</label>
                                <select id="estadoSocio" class="form-select">
                                    <option value="Todos">Todos</option>
                                    <option value="ACTIVO">Activo</option>
                                    <option value="INACTIVO">Inactivo</option>
                                    <option value="SUSPENDIDO">Suspendido</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label fw-semibold">Sede</label>
                                <select id="sedeSocio" class="form-select">
                                    <option value="Todos">Todas</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-outline-primary w-100">Filtrar</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Socio</th>
                                        <th>DNI</th>
                                        <th>Sede</th>
                                        <th>Estado</th>
                                        <th>Plan</th>
                                        <th>Último pago</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="sociosTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div class="modal fade" id="modalSocio" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered">
            <div class="modal-content rounded-4 border-0 shadow">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Alta / edición de socio</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="socioForm" class="row g-3">
                        <input type="hidden" id="socioId" />
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Nombre</label>
                            <input id="socioNombre" type="text" class="form-control" placeholder="Nombre" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Apellido</label>
                            <input id="socioApellido" type="text" class="form-control" placeholder="Apellido" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">DNI</label>
                            <input id="socioDni" type="text" class="form-control" placeholder="DNI" required />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Fecha nacimiento</label>
                            <input id="socioFechaNacimiento" type="date" class="form-control" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Teléfono</label>
                            <input id="socioTelefono" type="text" class="form-control" placeholder="Teléfono" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Email</label>
                            <input id="socioEmail" type="email" class="form-control" placeholder="Email" />
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Calle</label>
                            <select id="socioIdCalle" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Sede</label>
                            <select id="socioIdSede" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Convenio</label>
                            <select id="socioIdConvenio" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Plan</label>
                            <select id="socioPlan" class="form-select"></select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Estado</label>
                            <select id="socioEstadoCuenta" class="form-select">
                                <option value="ACTIVO">Activo</option>
                                <option value="SUSPENDIDO">Suspendido</option>
                                <option value="INACTIVO">Inactivo</option>
                            </select>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Observación</label>
                            <textarea id="socioObservacion" class="form-control" rows="3" placeholder="Observaciones"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="socioForm" class="btn btn-primary">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/miembros.js"></script>
</body>
</html>
