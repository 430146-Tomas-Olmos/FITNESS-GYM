<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Accesos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light" data-page="accesos.html">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>
                <nav class="nav nav-pills flex-column gap-2">
                    <a href="../../dashboard.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Dashboard</a>
                    <a href="../../miembros.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-people me-2"></i>Miembros</a>
                    <a href="socios.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-person-badge me-2"></i>Socios</a>
                    <a href="contratos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-file-earmark-text me-2"></i>Contratos</a>
                    <a href="cuotas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-cash-stack me-2"></i>Cuotas</a>
                    <a href="accesos.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-door-open me-2"></i>Accesos</a>
                    <a href="reservas.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-calendar3 me-2"></i>Reservas</a>
                    <a href="convenios.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-building me-2"></i>Convenios</a>
                    <a href="aptos-medicos.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-card-checklist me-2"></i>Aptos</a>
                    <a href="historial.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-clock-history me-2"></i>Historial</a>
                </nav>
            </aside>
            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <p class="text-uppercase text-secondary small mb-1 fw-semibold">Accesos / molinetes</p>
                        <h1 class="h2 fw-bold mb-0">Registro de ingreso</h1>
                    </div>
                    <button id="filtrarAccesosBtn" type="button" class="btn btn-primary fw-semibold">
                        <i class="bi bi-funnel me-2"></i>Filtrar</button>
                </div>

                <div class="card border-0 shadow-sm rounded-4 mb-4">
                    <div class="card-body">
                        <form id="validarAccesoForm" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Sede</label>
                                <select id="accesoIdSede" class="form-select" required></select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold">Socio</label>
                                <select id="accesoIdSocio" class="form-select" required disabled></select>
                            </div>
                            <div class="col-md-2">
                                <button type="submit" class="btn btn-primary w-100">Validar acceso</button>
                            </div>
                            <div class="col-md-2">
                                <div id="accesoResultado" class="fw-semibold text-muted">Resultado</div>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Socio</th>
                                        <th>Sede</th>
                                        <th>Hora</th>
                                        <th>Resultado</th>
                                        <th>Motivo</th>
                                    </tr>
                                </thead>
                                <tbody id="accesosTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/miembros.js"></script>
    <script src="../../assets/js/roleGuard.js"></script>
</body>
</html>
