<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-4 col-md-6">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-body p-4 p-lg-5">
                        <div class="text-center mb-4">
                            <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-gradient text-white mb-3" style="width: 72px; height: 72px;">
                                <i class="bi bi-person-arms-up fs-2"></i>
                            </div>
                            <h1 class="h3 fw-bold text-dark mb-1">FitLife Network</h1>
                            <p class="text-secondary mb-0">Sistema de gestión integral</p>
                        </div>

                        <div id="loginAlert" class="alert d-none" role="alert"></div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="nombre" class="form-label fw-semibold">Usuario</label>
                                <input id="nombre" name="nombre" type="text" class="form-control form-control-lg" placeholder="Ej: gerente.general" required />
                            </div>

                            <div class="mb-4">
                                <label for="contrasena" class="form-label fw-semibold">Contraseña</label>
                                <input id="contrasena" name="contrasena" type="password" class="form-control form-control-lg" placeholder="••••••" required />
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 fw-semibold">
                                Ingresar
                            </button>
                        </form>

                        <div class="mt-4 small text-secondary text-center">
                            <span class="fw-semibold">Usuarios demo:</span>
                            <div class="mt-2">
                                gerente.general / 123456
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="assets/js/roleGuard.js"></script>
</body>
</html>
