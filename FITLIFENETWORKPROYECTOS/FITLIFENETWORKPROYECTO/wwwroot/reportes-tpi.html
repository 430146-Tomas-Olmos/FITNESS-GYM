<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FitLife Network | Reportes de gestión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <style>
        /* La tabla de resultados es lo principal de esta pantalla: encabezado fijo y cifras alineadas. */
        .tabla-scroll { max-height: 58vh; overflow: auto; }
        .tabla-resultado thead th {
            position: sticky; top: 0; z-index: 1;
            background: var(--bs-tertiary-bg);
            box-shadow: inset 0 -1px 0 var(--bs-border-color);
            white-space: nowrap;
        }
        .tabla-resultado td { font-variant-numeric: tabular-nums; }
        #listaReportes .list-group-item { border-left-width: 3px; }
        #listaReportes .list-group-item.active small { color: rgba(255, 255, 255, .8) !important; }
        @media (prefers-reduced-motion: reduce) { .spinner-border { animation-duration: 1.5s; } }
    </style>
</head>
<body class="bg-light">
    <div class="container-fluid">
        <div class="row min-vh-100">
            <aside class="col-lg-2 bg-dark text-white p-3 d-flex flex-column">
                <div class="d-flex align-items-center gap-3 mb-4 px-2">
                    <div class="bg-primary rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                        <i class="bi bi-dumbbell text-white"></i>
                    </div>
                    <div>
                        <div class="fw-bold">FitLife</div>
                        <small class="text-light-emphasis">Network</small>
                    </div>
                </div>

                <nav class="nav nav-pills flex-column gap-2">
                    <a href="inicio.html" class="btn btn-dark text-start px-3 py-2 rounded-3 text-white-50"><i class="bi bi-house-door me-2"></i>Inicio</a>
                    <a href="reportes-tpi.html" class="btn btn-primary text-start px-3 py-2 rounded-3"><i class="bi bi-bar-chart-line me-2"></i>Reportes</a>
                </nav>

                <div class="mt-auto pt-4 border-top border-secondary">
                    <button id="logoutBtn" class="btn btn-outline-light w-100" type="button">
                        <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                    </button>
                </div>
            </aside>

            <main class="col-lg-10 p-4 p-lg-5">
                <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
                    <div>
                        <h1 class="h2 mb-1 fw-bold">Reportes de gestión</h1>
                        <p class="text-secondary mb-0">Elegí una consulta, ajustá los filtros y ejecutala para ver el resultado.</p>
                    </div>
                    <div class="d-flex align-items-center gap-3 bg-white rounded-4 px-3 py-2 shadow-sm">
                        <div class="rounded-circle bg-primary bg-gradient text-white d-flex align-items-center justify-content-center" style="width: 38px; height: 38px;">
                            <i class="bi bi-person-circle"></i>
                        </div>
                        <div>
                            <div id="userName" class="fw-semibold"></div>
                            <small id="userRole" class="text-secondary"></small>
                        </div>
                    </div>
                </div>

                <div class="row g-4">
                    <div class="col-lg-4 col-xl-3">
                        <nav aria-label="Consultas disponibles">
                            <div id="listaReportes" class="list-group shadow-sm rounded-4"></div>
                        </nav>
                    </div>

                    <div class="col-lg-8 col-xl-9">
                        <section class="card border-0 shadow-sm rounded-4" aria-labelledby="repTitulo">
                            <div class="card-body p-4">
                                <h2 id="repTitulo" class="h4 fw-bold mb-2"></h2>
                                <p id="repDescripcion" class="text-secondary mb-2"></p>
                                <div id="repTecnicas" class="mb-4 d-flex flex-wrap gap-1"></div>

                                <form id="repForm" novalidate>
                                    <div id="repCampos" class="row g-3 align-items-end"></div>
                                    <div class="d-flex flex-wrap align-items-center gap-3 mt-4">
                                        <button id="btnEjecutar" type="submit" class="btn btn-primary px-4">
                                            <i class="bi bi-play-fill me-1"></i>Ejecutar consulta
                                        </button>
                                        <button id="btnCsv" type="button" class="btn btn-outline-secondary" disabled>
                                            <i class="bi bi-download me-1"></i>Descargar CSV
                                        </button>
                                        <span id="repResumen" class="text-secondary" aria-live="polite"></span>
                                    </div>
                                </form>
                            </div>

                            <div class="px-4"><div id="repAviso" aria-live="polite"></div></div>
                            <div id="repTabla" class="border-top"></div>
                        </section>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/reportes-tpi.js"></script>
</body>
</html>
